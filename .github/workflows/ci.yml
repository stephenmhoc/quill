name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and Test
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Build Environment
        run: |
          xcodebuild -version
          swift --version

      # The e2e suites need the test Ghost on the homelab, so they run locally. See TESTING.md.
      - name: Run GhostKit Tests
        run: swift test --package-path Packages/GhostKit

      - name: Build iOS App
        run: |
          xcodebuild build \
            -project Quill.xcodeproj \
            -scheme Quill \
            -configuration Debug \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
