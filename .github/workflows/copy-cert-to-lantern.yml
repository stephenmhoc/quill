name: Copy Distribution Certificate to Lantern

# One-off: Lantern signs with the same Apple Distribution certificate (an account has only one), and
# its private key lives only in these secrets. Delete this workflow and LANTERN_SECRETS_TOKEN after.
on:
  workflow_dispatch:

permissions: {}

jobs:
  copy:
    runs-on: ubuntu-latest
    steps:
      - name: Copy
        env:
          GH_TOKEN: ${{ secrets.LANTERN_SECRETS_TOKEN }}
          CERT: ${{ secrets.APPLE_DISTRIBUTION_CERT_BASE64 }}
          PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_CERT_PASSWORD }}
          CERT_ID: ${{ secrets.APPLE_DISTRIBUTION_CERT_ID }}
        run: |
          printf '%s' "$CERT" | gh secret set APPLE_DISTRIBUTION_CERT_BASE64 -R stephenmhoc/lantern
          printf '%s' "$PASSWORD" | gh secret set APPLE_DISTRIBUTION_CERT_PASSWORD -R stephenmhoc/lantern
          printf '%s' "$CERT_ID" | gh secret set APPLE_DISTRIBUTION_CERT_ID -R stephenmhoc/lantern
