name: Quill
options:
  bundleIdPrefix: com.merimerimeri
  deploymentTarget:
    iOS: "18.0"
    macOS: "26.0"
  createIntermediateGroups: true

packages:
  GhostKit:
    path: Packages/GhostKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.7.0

settings:
  base:
    DEVELOPMENT_TEAM: 8G4H6268W7
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: 0.1.0
    CURRENT_PROJECT_VERSION: 1

targets:
  Quill:
    type: application
    platform: iOS
    sources:
      - Quill
    dependencies:
      - package: GhostKit
    entitlements:
      path: Quill/Quill.entitlements
      properties:
        # Everything the app writes is unreadable while the phone is locked.
        com.apple.developer.default-data-protection: NSFileProtectionComplete
    info:
      path: Quill/Info.plist
      properties:
        CFBundleDisplayName: Quill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIRequiresFullScreen: false
        UIApplicationSupportsIndirectInputEvents: true
        NSFaceIDUsageDescription: Quill uses Face ID to keep your writing and site keys private.
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Lets the simulator reach a dev Ghost on http://localhost; real sites use HTTPS.
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.Quill
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - QuillTests
        - QuillUITests

  # Native, not Catalyst. Shares the models, services and site forms, with its own window and editor.
  QuillMac:
    type: application
    platform: macOS
    sources:
      - QuillMac
      - Quill/Models
      - Quill/Vault
      - path: Quill/Services
        excludes:
          - AppIconChoice.swift
          - LinkBrowser.swift
      - Quill/Views/AddSiteView.swift
      - Quill/Views/EntryListView.swift
      - Quill/Views/GhostSiteForm.swift
      - Quill/Views/LocalSiteForm.swift
      - Quill/Views/LockView.swift
      - Quill/Views/MicroblogSiteForm.swift
      - Quill/Views/PlatformStyle.swift
      - Quill/Views/SitePostsView.swift
      - Quill/Views/Editor/EditorPieces.swift
      - Quill/Views/Editor/EntryPreview.swift
      - Quill/Views/Editor/MarkdownFormat.swift
      - Quill/Views/Editor/MarkdownStyler.swift
    dependencies:
      - package: GhostKit
      - package: Sparkle
    entitlements:
      path: QuillMac/QuillMac.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-only: true
        com.apple.security.print: true
        # Lets Sparkle's installer run from inside the sandbox.
        com.apple.security.temporary-exception.mach-lookup.global-name:
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spks
          - $(PRODUCT_BUNDLE_IDENTIFIER)-spki
        keychain-access-groups:
          - $(AppIdentifierPrefix)$(PRODUCT_BUNDLE_IDENTIFIER)
    info:
      path: QuillMac/Info.plist
      properties:
        CFBundleDisplayName: Quill
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        SUFeedURL: https://github.com/stephenmhoc/quill/releases/download/appcast/appcast.xml
        SUPublicEDKey: YNe2V/xce3HQJv4cZ8+d5tLFFIwEP7OiVUkXDgz+wo8=
        SUEnableInstallerLauncherService: true
        SUEnableAutomaticChecks: true
        NSHumanReadableCopyright: ""
        ITSAppUsesNonExemptEncryption: false
        NSAppTransportSecurity:
          # Lets a dev build reach a Ghost on http://localhost; real sites use HTTPS.
          NSAllowsLocalNetworking: true
    settings:
      configs:
        # Development builds and tests get their own data and Keychain items, so they can never
        # touch the copy of Quill in /Applications.
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.Quill.dev
          ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon-Dev
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.Quill
      base:
        PRODUCT_NAME: Quill
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor
        SWIFT_APPROACHABLE_CONCURRENCY: YES
        ENABLE_HARDENED_RUNTIME: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
    scheme:
      testTargets:
        - QuillMacUITests

  QuillMacUITests:
    type: bundle.ui-testing
    platform: macOS
    sources:
      - QuillMacUITests
    dependencies:
      - target: QuillMac
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.QuillMacUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: QuillMac

  QuillTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - QuillTests
    dependencies:
      - target: Quill
      - package: GhostKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.QuillTests
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_DEFAULT_ACTOR_ISOLATION: MainActor

  QuillUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - QuillUITests
    dependencies:
      - target: Quill
      - package: GhostKit
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.merimerimeri.QuillUITests
        TARGETED_DEVICE_FAMILY: "1,2"
